# .github/workflows/build-windows.yml
name: Build Windows EXE with PyInstaller

on:
  # 当代码被推送到 main 分支时触发
  push:
    branches: [ "main" ]
  # 允许你从 GitHub 的 Actions 选项卡手动触发这个工作流
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    # 指定运行环境为最新版的 Windows
    runs-on: windows-latest
    steps:
      # 1. 拉取你的代码仓库
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 指定你要使用的 Python 版本
          python-version: '3.8'

      # 3. 安装项目依赖和 PyInstaller
      - name: Install dependencies
        run: |
          pip install .
          # 安装 PyInstaller
          pip install pyinstaller

      # 4. 使用 PyInstaller 打包成单个 .exe 文件
      - name: Build with PyInstaller
        run: |
          # --onefile: 打包成单个文件
          # --noconsole: 如果你的程序有 GUI (如 tkinter, PyQt)，加上这个可以隐藏命令行窗口
          echo "ACCESS_KEY_ID=${{ secrets.ACCESS_KEY_ID }}" >> .env
          echo "ACCESS_KEY_SECRET=${{ secrets.ACCESS_KEY_SECRET }}" >> .env
          echo "TEMPLATE_CODE=${{ secrets.TEMPLATE_CODE }}" >> .env
          echo "SIGN_NAME=${{ secrets.SIGN_NAME }}" >> .env
          pyinstaller insert.spec
          pyinstaller send_sms.spec

      # 5. 将生成的 .exe 文件上传为 Artifact，方便下载
      - name: Upload Windows EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          # Artifact 的名称，下载时会是一个 zip 包
          name: windows-exe
          # 上传 dist 文件夹下所有 .exe 文件
          path: dist/*.exe
  publish:
    # 这个任务依赖于 build 任务成功完成
    needs: build
    # 只有当我们通过 release 事件触发时，才运行这个任务
    if: github.event_name == 'release'
    runs-on: ubuntu-latest  # 下载和上传任务在 ubuntu 上执行更快
    permissions:
      contents: write       # 必须授予写入权限，才能上传附件到 Release
    steps:
      # 第一步：下载由 build 任务上传的 .exe 文件
      - name: Download built EXE
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./artifacts

      # 第二步：将下载的 .exe 文件上传到触发工作流的 Release
      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.exe
