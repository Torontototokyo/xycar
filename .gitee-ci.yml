# .gitee-ci.yml
stages: # 定义流水线的执行阶段[citation:1][citation:8]
  - stage:
      name: build-and-package
      displayName: '构建并打包 EXE'
      steps:
        # 第一步：拉取代码
        - step: checkout@v1
          name: checkout_code
          displayName: '拉取代码'
          
        # 第二步：设置 Python 环境
        - step: setup-python@v3
          name: setup_python
          displayName: '设置 Python 环境'
          with:
            python-version: '3.11' # 你可以指定需要的 Python 版本[citation:11]

        # 第三步：安装依赖
        - step: cmd@v1
          name: install_deps
          displayName: '安装项目依赖'
          commands:
            - python -m pip install --upgrade pip
            - pip install -r requirements.txt # 如果项目有 requirements.txt
            - pip install pyinstaller

        # 第四步：执行 PyInstaller 打包
        - step: cmd@v1
          name: build_exe
          displayName: '使用 PyInstaller 打包'
          commands:
            # 请将 your_script.py 替换为你的主程序文件名
            # --onefile 打包成单个 exe 文件
            # --noconsole 如果你的程序有 GUI 界面，可以加上这个参数隐藏命令行窗口
            - pyinstaller --onefile your_script.py

        # 第五步：上传构建产物 (可选)
        # 这一步可以将生成的 .exe 文件作为附件保存起来，方便下载
        - step: upload-artifacts@v1
          name: upload_exe
          displayName: '上传 EXE 文件'
          with:
            path: dist/*.exe # 指定要上传的文件路径[citation:3][citation:11]